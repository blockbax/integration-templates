default:
    description: Should parse RouterData records and add measurements
    payload: ./payloads/validPayload.json
    expectedMeasurements:
        - ingestionId: RouterInfo-1$400040
          value: "1122577335"
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo-1$400072
          value: "TRB255"
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo-1$400144
          value: 50.976974
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo-1$400146
          value: 3.199957
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo-1$location
          value: { "lat": 50.976974, "lon": 3.199957, "alt": 0 }
          date: 2024-03-27T22:48:20.000+00:00

internal-temperature-probe-valid-payload:
    description: Should parse blockbax_test_connector records and add numeric measurements
    payload: ./payloads/internalTemperaturePayload.json
    expectedMeasurements:
        - ingestionId: bx-test-server-1$400006
          value: 310
          date: 2025-10-06T12:35:46.000+00:00
        - ingestionId: bx-test-server-1$400006
          value: 320
          date: 2025-10-06T12:42:46.000+00:00
        - ingestionId: bx-test-server-1$400006
          value: 330
          date: 2025-10-06T12:43:46.000+00:00

invalid-not-array-payload:
    description: Should log error when payload records are not arrays
    payload: ./payloads/notArrayPayload.json
    expectedLogs:
        - level: ERROR
          message: No valid records array found

partial-missing-fields:
    description: Should parse only complete records when some records are missing required fields
    payload: ./payloads/partialMissingPayload.json
    expectedMeasurements:
        - ingestionId: RouterInfo-1$400040
          value: "1122577335"
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo-1$400146
          value: 3.199957
          date: 2024-03-27T22:48:20.000+00:00

location-ingestion-valid-and-invalid-payload:
    description: Should location ingested only when lat and lon exist on the same timestamp
    payload: ./payloads/locationIngestionValidAndInvalidPayload.json
    expectedMeasurements:
        - ingestionId: RouterInfo1-1$400144
          value: 50.0
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo1-1$400146
          value: 3.0
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo1-1$location
          value: { "lat": 50.0, "lon": 3.0, "alt": 0 }
          date: 2024-03-27T22:48:20.000+00:00
        - ingestionId: RouterInfo2-1$400144
          value: 55.0
          date: 2024-03-27T22:50:00.000+00:00
        - ingestionId: RouterInfo2-1$400146
          value: 4.0
          date: 2024-03-27T22:51:40.000+00:00
        - ingestionId: RouterInfo3-1$400146
          value: 6.0
          date: 2024-03-27T22:52:00.000+00:00

register-info-missing-map-warn:
    description: Should log warn when register info not found and value will not be validated
    payload: ./payloads/registerInfoMissingPayload.json
    expectedLogs:
        - level: WARN
          message: Register info not found for addr 999 (subject=RouterInfoX-1, metric=400999). Value will not be validated.

value-with-wrong-data-type-payload:
    description: Should log warn when register info not found and value will not be validated
    payload: ./payloads/valueWithWrongDataType.json
    expectedLogs:
        - level: WARN
          message: 'Unable to parse value for addr 6 (subject=bx-test-server-1, metric=400006). Invalid data type: expected integer, got "should be number"'
